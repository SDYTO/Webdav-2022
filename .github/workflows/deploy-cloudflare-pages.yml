name: Deploy to Cloudflare Pages

# ── 这就是「一键部署」按钮 ──────────────────────────────────────────────
# 在 GitHub 上：Actions 标签页 → 左侧选本工作流 → 右侧 Run workflow。
# README 顶部的部署按钮直接指向本页面，点击后按提示填几个参数即可。
#
# 说明：Cloudflare 官方的「Deploy to Cloudflare」按钮只支持 Workers 应用
# （官方文档 Limitations 明确写着 "Pages applications: Deploy to Cloudflare
# buttons only support Workers applications."），本项目是 Pages + Pages Functions，
# 所以改用本工作流作为等价的一键部署入口，功能上覆盖得更多：
# 自动建 R2 桶、自动建 Pages 项目、自动写入写操作口令、构建并部署。

on:
  # 推送到 main 即自动部署（日常更新走这条）
  push:
    branches: [main]
  # 也可手动触发，并自定义项目名 / 桶名等参数
  workflow_dispatch:
    inputs:
      project_name:
        description: "Cloudflare Pages 项目名（不存在会自动创建）"
        required: true
        default: "ytodb"
        type: string
      bucket_name:
        description: "R2 桶名（只能小写字母/数字/连字符，不存在会自动创建）"
        required: true
        default: "ytodb"
        type: string
      branch:
        description: "部署分支（生产环境填 main）"
        required: true
        default: "main"
        type: string
      create_bucket:
        description: "R2 桶不存在时自动创建"
        required: true
        default: true
        type: boolean
      sync_admin_password:
        description: "把仓库 Secret ADMIN_PASSWORD 同步为 Pages 项目口令"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并部署
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # push 触发时 inputs 为空，回落到生产默认值（项目 ytodb / 桶 ytodb / main）
      PROJECT: ${{ inputs.project_name || 'ytodb' }}
      BUCKET: ${{ inputs.bucket_name || 'ytodb' }}
      BRANCH: ${{ inputs.branch || 'main' }}
      CREATE_BUCKET: ${{ github.event_name == 'push' && 'true' || inputs.create_bucket }}

    steps:
      - name: 校验必填凭证
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::缺少仓库 Secret CLOUDFLARE_API_TOKEN。"
            echo "::error::添加方式：Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::取值：https://dash.cloudflare.com/profile/api-tokens 创建自定义令牌，"
            echo "::error::权限至少需要 Cloudflare Pages:Edit；勾选了自动建桶还需要 Workers R2 Storage:Edit。"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning::未设置 CLOUDFLARE_ACCOUNT_ID。账号下只有一个账号时可留空，否则请补上。"
          fi
          if ! printf '%s' "$BUCKET" | grep -qE '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'; then
            echo "::error::R2 桶名不合法：$BUCKET（只允许小写字母/数字/连字符，长度 3–63 位）"
            exit 1
          fi
          echo "✓ 凭证检查通过"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 把项目名与桶名写入 wrangler.toml
        run: |
          set -euo pipefail
          sed -i -E "s|^([[:space:]]*name[[:space:]]*=[[:space:]]*\")[^\"]*(\")|\1${PROJECT}\2|" wrangler.toml
          sed -i -E "s|^([[:space:]]*bucket_name[[:space:]]*=[[:space:]]*\")[^\"]*(\")|\1${BUCKET}\2|" wrangler.toml
          echo "当前 wrangler.toml 关键配置："
          grep -nE '^[[:space:]]*(name|bucket_name|compatibility_date)' wrangler.toml

      - name: 确保 R2 桶存在
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket list 2>/dev/null | grep -qE "(^|[[:space:]])${BUCKET}([[:space:]]|$)"; then
            echo "✓ R2 桶已存在：$BUCKET"
          elif [ "${CREATE_BUCKET}" = "true" ]; then
            echo "→ 创建 R2 桶：$BUCKET"
            npx wrangler r2 bucket create "$BUCKET"
            echo "✓ R2 桶已创建"
          else
            echo "::error::R2 桶 $BUCKET 不存在，且本次未勾选「自动创建」。"
            exit 1
          fi

      - name: 确保 Pages 项目存在
        run: |
          set -euo pipefail
          if npx wrangler pages project list 2>/dev/null | grep -qE "(^|[[:space:]])${PROJECT}([[:space:]]|\$)"; then
            echo "✓ Pages 项目已存在：$PROJECT"
          else
            echo "→ 创建 Pages 项目：$PROJECT"
            npx wrangler pages project create "$PROJECT" --production-branch "$BRANCH"
            echo "✓ Pages 项目已创建"
          fi

      - name: 同步写操作口令
        if: ${{ inputs.sync_admin_password || github.event_name == 'push' }}
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo "::warning::仓库未设置 Secret ADMIN_PASSWORD，跳过。未配置时所有写操作返回 503，只读浏览不受影响。"
            exit 0
          fi
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler pages secret put ADMIN_PASSWORD --project-name "$PROJECT"
          echo "✓ 写操作口令已写入（加密 Secret，不会出现在构建日志里）"
          # 只打印长度，便于核对「Secret 是不是空的/被改过」，不泄露内容
          echo "  口令长度：${#ADMIN_PASSWORD} 位"

      - name: 构建
        run: npm run build

      - name: 部署到 Cloudflare Pages
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler pages deploy build --project-name "$PROJECT" --branch "$BRANCH" 2>&1 | tee deploy.log
          URL="$(grep -oE 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.log | tail -1 || true)"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "部署地址：${URL:-（未从输出中解析到，请到 Cloudflare 控制台查看）}"

      - name: 部署后自校验
        if: always() && steps.deploy.outputs.url != ''
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -uo pipefail
          BASE="${{ steps.deploy.outputs.url }}"
          fail=0
          check() { # $1=名称 $2=期望码 $3=实际码
            if [ "$2" = "$3" ]; then
              echo "✓ $1：HTTP $3"
            else
              echo "::error::$1 期望 HTTP $2，实际 HTTP $3"
              fail=1
            fi
          }

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/")
          check "首页可访问" 200 "$code"

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X PROPFIND -H 'Depth: 1' "$BASE/webdav/")
          check "WebDAV 匿名读取" 207 "$code"

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/api/auth")
          check "匿名登录校验被拒" 401 "$code"

          if [ -n "${ADMIN_PASSWORD:-}" ]; then
            # 用 Secret 里的口令实际登录一次：这是「部署成功但登不进去」的唯一可靠判据
            b64=$(printf '%s' "admin:${ADMIN_PASSWORD}" | base64 -w0)
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H "Authorization: Basic $b64" "$BASE/api/auth")
            if [ "$code" = "200" ]; then
              echo "✓ 口令登录校验：HTTP 200"
            else
              echo "::error::口令登录校验失败（HTTP $code，期望 200）。"
              echo "::error::最常见原因：Secret ADMIN_PASSWORD 的值不是你要用的口令，或本次运行没有同步口令。"
              echo "::error::修复：Settings → Secrets and variables → Actions → 检查 ADMIN_PASSWORD，"
              echo "::error::然后用 sync_admin_password=true 手动重跑本工作流。"
              echo "::error::注意：Secret 里的值就是线上真实口令，改了 Secret 必须重跑部署才会生效。"
              fail=1
            fi
          fi

          exit $fail

      - name: 写入部署摘要
        if: always()
        run: |
          {
            echo "## Cloudflare Pages 部署结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| Pages 项目 | \`$PROJECT\` |"
            echo "| R2 桶 | \`$BUCKET\` |"
            echo "| 分支 | \`$BRANCH\` |"
            echo "| 访问地址 | ${{ steps.deploy.outputs.url || '—' }} |"
            echo ""
            echo "### 部署后请确认"
            echo ""
            echo "1. R2 桶**未开启**公共访问（公共开发域名会绕过全部鉴权逻辑）"
            echo "2. 自定义域已开启 **Always Use HTTPS**（Basic 凭据是明文头）"
            echo "3. 给 \`/api/*\` 加一条限速规则，抵挡口令爆破"
          } >> "$GITHUB_STEP_SUMMARY"
